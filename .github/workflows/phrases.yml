name: Build phrase dictionaries

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to build (app code:Leipzig code)"
        default: "ar:ara en:eng"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build dictionaries with next-word predictions
        run: |
          mkdir -p dicts
          for pair in ${{ github.event.inputs.languages }}; do
            lang=${pair%%:*}
            code=${pair##*:}
            echo "=== $lang ($code) ==="
            python3 tools/build_phrases.py "$lang" "$code" "/tmp/main_$lang.combined"
            java -jar tools/dicttool.jar makedict -s "/tmp/main_$lang.combined" -d "dicts/main_$lang.dict"
            ls -l "dicts/main_$lang.dict"
          done
      - name: Save to the repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dicts
          git commit -m "Phrase dictionaries: ${{ github.event.inputs.languages }}" || echo "nothing changed"
          git push
