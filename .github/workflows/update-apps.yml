name: Update apps from Google Play

on:
  schedule:
    - cron: '17 3 * * *'   # every day 03:17 UTC (06:17 Riyadh)
  workflow_dispatch:        # "Run workflow" button
  push:
    paths:
      - 'scripts/**'        # rebuild when the site scripts or texts change

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Read Google Play developer page
        run: node scripts/fetch-apps.mjs

      - name: Build site pages
        run: node scripts/build-site.mjs

      - name: Save changes
        run: |
          printf "node_modules/\npackage-lock.json\n" >> .git/info/exclude
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update apps from Google Play"
            git push
          fi
